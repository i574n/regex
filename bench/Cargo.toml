[package]
name = "regex-bench"
version = "0.0.1"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/i574n/regex"

[package.metadata.spiral]
entry = "bench.spi"
output = "bench.rs"

[[bin]]
name = "regex-bench"
path = "bench.rs"

[dependencies]
rx_external = { workspace = true }
rx_crate = { workspace = true }
rx_lazy = { workspace = true }
rx_emit = { workspace = true }
rx_facts = { workspace = true }
rx_conformance = { workspace = true }
bench_parts = { path = "bench_parts" }
