[workspace]
resolver = "3"
members = ["bench", "rx_external", "rx_crate", "ssv_video", "rx_lazy", "rx_emit", "rx_facts", "rx_conformance"]

[workspace.dependencies]
regex = "1.10"
regex-automata = "0.4"
rx_external = { path = "rx_external" }
rx_crate = { path = "rx_crate" }
rx_lazy = { path = "rx_lazy" }
rx_emit = { path = "rx_emit" }
rx_facts = { path = "rx_facts" }
rx_conformance = { path = "rx_conformance" }

[profile.release]
codegen-units = 16
opt-level = 3
lto = "thin"
debug = false
panic = "abort"
overflow-checks = true
